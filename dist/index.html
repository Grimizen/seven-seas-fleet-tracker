<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101f29"><meta name="description" content="Your fleet, ready for the next turn."><title>Seven Seas · Fleet log</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101f29'/%3E%3Cpath d='M16 5v19M9 17v5q7 9 14 0v-5M11 10h10' fill='none' stroke='%23e5b76c' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./">⚓ <span>SEVEN SEAS<small>FLEET LOG</small></span></a><label class="vessel-picker">VESSEL<select id="vessel" aria-label="Select vessel"></select></label><div class="session"><span id="save-status">Local playtest · this device only</span><button id="profile">Set your name</button></div></header><main><section class="ship-view"><div class="heading"><div><p class="eyebrow">YOUR FLEET / <span id="ship-class"></span></p><h1 id="ship-name"></h1></div><span class="tag" id="sail-tag"></span></div><div class="diagram-header"><span>VESSEL OVERVIEW</span><span>Select a station to inspect</span></div><div id="diagram"></div><div class="legend"><span>● Operational</span><span class="amber">● Damaged</span><span class="red">● Destroyed</span></div><section class="integrity"><div><span>HULL INTEGRITY</span><strong id="hull-value"></strong></div><progress id="hull-progress"></progress><p id="hull-note"></p><button id="hull-select">Manage hull</button></section><div class="metrics" id="metrics"></div></section><aside><nav aria-label="Ship controls" id="tabs"></nav><div id="panel"></div></aside><section class="activity"><div class="activity-heading"><h2>Ship’s log</h2><button id="undo">Undo last action</button></div><ol id="log"></ol></section></main><div id="toast" role="status" aria-live="polite"></div><dialog id="profile-dialog"><form method="dialog" id="profile-form"><h2>Who’s aboard?</h2><p>Your name appears in this device’s ship log. Shared sign-in will come with Firebase.</p><label>Display name<input id="display-name" maxlength="40" required autocomplete="nickname"></label><div class="actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="save">Save name</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
